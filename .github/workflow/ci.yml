name: CI Checks

# Trigger this workflow on pushes and pull requests to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up the programming environment (e.g., Node.js)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run your linter
      - name: Run Linter
        run: npm run lint

      # 5. Run your tests
      - name: Run Tests
        run: npm test
